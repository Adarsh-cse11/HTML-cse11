<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperlink and Multimedia</title>
</head>
<body>
     <!-- image insert  -->
     <img src="IMAGE.jpg" alt="Image" width="500" height="333"> 

     <!-- hyperlink to google -->

         <a href="https://www.google.com"> click here to open Google</a>

        <!-- audio insert  -->

     <audio controls autoplay muted >
    <source src="audio file.mp3" type="audio/mpeg">
    </audio> 

    <!-- EXTERNAL VIDEO INSERT  -->

     <iframe width="560" height="315" src="https://www.youtube.com/embed/MUMCZZl9QCY?si=9EMwgFeur3Jko_uQ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

<!-- VIDEO INSERT  -->
     <video controls height ="300px"  width="400px" >
        <source src="VIDEO.MP4" type="video/mp4">
    </video>


    
</body>
</html>
