<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>semantic and non-semantic</title>
</head>
<body>
    <!-- semantic elements  -->
     <header>
        <h1> this is heading using header tag (semantic element) </h1>
     </header>
    <article>
        <p> this is using article tag (semantic element)</p>

        <!-- non semantic element -->


         <p> <b> this is bold tag (non semantic element) </b></p>

        <span style="color: red">  this is span tag (non semantic element) </span>

</body>
</html>
